esphome:
  name: esphome-web-3849ec
  friendly_name: ESPHome Web 3849ec

  on_boot:
    priority: -100
    then:
      - switch.turn_on: soil_sensor_power
      - delay: 2s
      - component.update: soil_moisture
      - delay: 10s
      - switch.turn_off: soil_sensor_power
      - deep_sleep.enter: deep_sleep_1

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    pin: GPIO25
    id: soil_sensor_power
    restore_mode: ALWAYS_OFF

sensor:
  - platform: adc
    pin: GPIO34
    id: soil_moisture
    name: "Jordfuktighet"
    attenuation: 11db
    update_interval: never

    filters:
      - calibrate_linear:
          - 0.80 -> 100
          - 2.60 -> 0
      - clamp:
          min_value: 0
          max_value: 100

    unit_of_measurement: "%"

deep_sleep:
  id: deep_sleep_1
  sleep_duration: 5min