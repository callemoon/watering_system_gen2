esphome:
  name: s3
  friendly_name: s3

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Logging
logger:
  level: INFO

# Home Assistant API
api:
  encryption:
    key: "QDZcEMF0iITZtsBU+Fxdubby5VwHy178Pfs4bDkjRKI="

ota:
  platform: esphome
  password: "7ba70b91f9521761ef9382d82ed27002"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "S3 Fallback Hotspot"
    password: "sQOZ87CDojDw"

captive_portal:

sensor:
  - platform: adc
    pin: GPIO1
    id: soil_moisture
    name: "Jordfuktighet"
    attenuation: 11db

    update_interval: 30s   # sparar batteri (du kör ändå deep sleep)

    filters:
      # ta bort brus
      - median:
          window_size: 5
          send_every: 1

      # kalibrering
      - calibrate_linear:
          - 0.80 -> 100
          - 2.60 -> 0

      # clamp till rimligt intervall
      - clamp:
          min_value: 0
          max_value: 100

    unit_of_measurement: "%"
    accuracy_decimals: 1

deep_sleep:
  id: deep_sleep_control
  run_duration: 1min
  sleep_duration: 5min
  sleep_duration: 5min
